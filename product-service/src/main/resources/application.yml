server: 
  port: 8082

spring: 
  application: 
    name: product-service 

  datasource: 
    url: jdbc:h2:mem:productdb 
    driver-class-name: org.h2.Driver 
    username: sa 
    password: manager

  jpa: 
    database-platform: org.hibernate.dialect.H2Dialect 
    show-sql: true 
    hibernate: 
      ddl-auto: update
    defer-datasource-initialization: true

  sql: 
    init: 
      mode: always

  h2: 
    console: 
      enabled: true 
      path: /h2-console




































































































