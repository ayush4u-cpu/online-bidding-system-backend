server:
  port: 8083

spring:
  application:
    name: wallet-service

  datasource:
    url: jdbc:h2:mem:walletdb
    driver-class-name: org.h2.Driver
    username: sa
    password: manager

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true

  sql: 
    init: 
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console
