spring.application.name=api-gateway
server.port=8080
jwt.secret=JWT_SECRET
gateway.public-endpoints=POST:/auth/login,POST:/auth/register,POST:/auth/refresh

# User Service
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

# Auction Service 
spring.cloud.gateway.server.webflux.routes[1].id=auction-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/auctions/**

# Bid Service 
spring.cloud.gateway.server.webflux.routes[2].id=bid-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/bids/**

# Payment Service
spring.cloud.gateway.server.webflux.routes[3].id=payment-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/payments/**
