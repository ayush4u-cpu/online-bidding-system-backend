<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Bidding Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --success-color: #2ea44f;
            --error-color: #f85149;
            --border-color: #30363d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        h1 {
            color: #ffffff;
            margin-top: 0;
            text-align: center;
            font-weight: 600;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }

        .connected {
            background-color: rgba(46, 164, 79, 0.2);
            color: var(--success-color);
            border: 1px solid var(--success-color);
        }

        .disconnected {
            background-color: rgba(248, 81, 73, 0.2);
            color: var(--error-color);
            border: 1px solid var(--error-color);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: #8b949e;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: #ffffff;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1f6feb;
        }

        .feed-card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--bg-color);
            padding: 15px;
            height: 300px;
            overflow-y: auto;
        }

        .bid-item {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.3s ease-in-out;
        }

        .bid-item:last-child {
            border-bottom: none;
        }

        .bidder-name {
            font-weight: bold;
            color: #ffffff;
        }

        .bid-amount {
            color: var(--success-color);
            font-weight: bold;
        }

        .bid-time {
            font-size: 0.8em;
            color: #8b949e;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Real-Time Bidding Platform</h1>
        <div style="text-align: center;">
            <span id="status" class="status-badge disconnected">Disconnected</span>
        </div>

        <div class="grid">
            <div>
                <h3>Place a Bid</h3>
                <div class="form-group">
                    <label for="auctionId">Auction ID</label>
                    <input type="number" id="auctionId" value="1">
                </div>
                <div class="form-group">
                    <label for="bidderId">Bidder ID</label>
                    <input type="number" id="bidderId" value="101">
                </div>
                <div class="form-group">
                    <label for="bidderName">Bidder Name</label>
                    <input type="text" id="bidderName" value="Alice">
                </div>
                <div class="form-group">
                    <label for="amount">Bid Amount ($)</label>
                    <input type="number" id="amount" step="0.01" value="100.00">
                </div>
                <button onclick="placeBid()">Submit Bid</button>
            </div>

            <div>
                <h3>Live Bids for Auction <span id="currentAuction">1</span></h3>
                <button onclick="subscribeToAuction()" style="margin-bottom: 15px; background-color: #21262d; border: 1px solid var(--border-color);">Monitor Auction</button>
                <div id="bidFeed" class="feed-card">
                    <div style="text-align: center; color: #8b949e; padding-top: 100px;">No live bids to display</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let stompClient = null;
        let subscription = null;

        function connect() {
            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            stompClient.debug = null; // disable console spam
            
            stompClient.connect({}, function (frame) {
                const statusEl = document.getElementById('status');
                statusEl.innerText = 'Connected';
                statusEl.className = 'status-badge connected';
                subscribeToAuction();
            }, function (error) {
                const statusEl = document.getElementById('status');
                statusEl.innerText = 'Disconnected - Retrying...';
                statusEl.className = 'status-badge disconnected';
                setTimeout(connect, 5000);
            });
        }

        function subscribeToAuction() {
            const auctionId = document.getElementById('auctionId').value;
            document.getElementById('currentAuction').innerText = auctionId;
            
            if (subscription) {
                subscription.unsubscribe();
            }

            const feed = document.getElementById('bidFeed');
            feed.innerHTML = '<div style="text-align: center; color: #8b949e; padding-top: 100px;">Subscribed! Waiting for bids...</div>';

            // Fetch existing bids first
            fetch(`/bids/auction/${auctionId}`)
                .then(res => res.json())
                .then(bids => {
                    feed.innerHTML = '';
                    if (bids.length === 0) {
                        feed.innerHTML = '<div style="text-align: center; color: #8b949e; padding-top: 100px;">No bids placed yet.</div>';
                    } else {
                        bids.forEach(bid => addBidToFeed(bid));
                    }
                })
                .catch(err => console.error("Error loading bids:", err));

            // Subscribe to live broadcast
            subscription = stompClient.subscribe(`/topic/auction/${auctionId}`, function (message) {
                const bid = JSON.parse(message.body);
                // Remove placeholder if present
                if (feed.innerText.includes("No bids placed yet") || feed.innerText.includes("Waiting for bids")) {
                    feed.innerHTML = '';
                }
                addBidToFeed(bid, true);
            });
        }

        function addBidToFeed(bid, prepend = false) {
            const feed = document.getElementById('bidFeed');
            const item = document.createElement('div');
            item.className = 'bid-item';
            
            const time = new Date(bid.bidTime).toLocaleTimeString();
            
            item.innerHTML = `
                <div>
                    <div class="bidder-name">${bid.bidderName} <span class="bid-time">(${time})</span></div>
                    <div style="font-size: 0.8em; color: #8b949e;">Bidder ID: ${bid.bidderId}</div>
                </div>
                <div class="bid-amount">$${parseFloat(bid.amount).toFixed(2)}</div>
            `;

            if (prepend) {
                feed.insertBefore(item, feed.firstChild);
            } else {
                feed.appendChild(item);
            }
        }

        function placeBid() {
            const auctionId = parseInt(document.getElementById('auctionId').value);
            const bidderId = parseInt(document.getElementById('bidderId').value);
            const bidderName = document.getElementById('bidderName').value;
            const amount = parseFloat(document.getElementById('amount').value);

            const bidPayload = {
                auctionId: auctionId,
                bidderId: bidderId,
                bidderName: bidderName,
                amount: amount
            };

            if (stompClient && stompClient.connected) {
                stompClient.send("/app/place-bid", {}, JSON.stringify(bidPayload));
                // Increment amount for ease of testing next bid
                document.getElementById('amount').value = (amount + 10).toFixed(2);
            } else {
                alert("WebSocket not connected. Trying HTTP fallback...");
                fetch('/bids', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bidPayload)
                })
                .then(res => {
                    if (!res.ok) return res.json().then(d => { throw new Error(d.error) });
                    return res.json();
                })
                .then(bid => {
                    document.getElementById('amount').value = (amount + 10).toFixed(2);
                })
                .catch(err => alert("Error placing bid: " + err.message));
            }
        }

        // Initialize connection
        connect();
    </script>
</body>
</html>
